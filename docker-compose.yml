services:
  postgres:
    image: postgres:15-alpine
    container_name: epfiles-postgres
    environment:
      POSTGRES_USER: epfiles
      POSTGRES_PASSWORD: epfiles
      POSTGRES_DB: epfiles
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epfiles -d epfiles"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - epfiles_network

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: epfiles-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://epfiles:epfiles@postgres:5432/epfiles
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY:-}
      APP_ENV: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      CHROMA_DB_PATH: /app/chroma_db
    volumes:
      - chroma_data:/app/chroma_db
    ports:
      - "8000:8000"
    networks:
      - epfiles_network

  frontend:
    build:
      context: ./packages/interface
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
        NEXT_PUBLIC_APP_ENV: development
        NEXT_PUBLIC_FREE_MESSAGE_COUNT: "10"
    container_name: epfiles-frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
      NEXT_PUBLIC_APP_ENV: development
    ports:
      - "3000:3000"
    networks:
      - epfiles_network

volumes:
  postgres_data:
  chroma_data:

networks:
  epfiles_network:
    driver: bridge

